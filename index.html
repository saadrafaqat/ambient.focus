<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient Focus Mixer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500/30">

    <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-900/40 via-slate-950 to-slate-950 -z-10"></div>

    <div id="app-container" class="glass p-8 rounded-3xl shadow-2xl max-w-md w-full border border-white/10">
        <h1 class="text-2xl font-light text-center mb-8 tracking-[0.2em] text-indigo-200">FOCUS MIXER</h1>
        
        <div id="mixer" class="space-y-6">
            </div>

        <div class="mt-8 pt-6 border-t border-white/10">
            <label class="block text-xs uppercase tracking-widest mb-2 text-slate-400">Master Volume</label>
            <input type="range" id="master-volume" min="0" max="1" step="0.01" value="1" class="w-full h-1.5 rounded-full appearance-none bg-white/20">
        </div>
    </div>

    <div id="lock-screen" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass p-8 rounded-3xl text-center max-w-sm w-full border border-white/10">
            <h2 class="text-xl mb-4">Trial Ended</h2>
            <p class="text-slate-400 mb-6">Your 2-day trial has ended. Contact me at <a href="mailto:dev@example.com" class="text-indigo-400 underline">dev@example.com</a> to purchase a permanent key.</p>
            <button id="unlock-btn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition-all font-medium">Enter Access Key</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
